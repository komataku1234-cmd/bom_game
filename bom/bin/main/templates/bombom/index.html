<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${title}">Bomb Game</title>

<style>
    body{
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to bottom, #111, #222);
        overflow: hidden;
        font-family: "Arial", sans-serif;
    }

    .title-box{
        display: flex;
        align-items: center;
        gap: 40px;
    }

    .bomb{
        font-size: 80px;
        animation: shake 1s infinite;
    }

    h1{
        color: white;
        font-size: 70px;
        letter-spacing: 8px;
        text-shadow:
            0 0 10px red,
            0 0 20px orange,
            0 0 40px yellow;
    }

    @keyframes shake{
        0%   { transform: rotate(0deg); }
        25%  { transform: rotate(-10deg); }
        50%  { transform: rotate(10deg); }
        75%  { transform: rotate(-10deg); }
        100% { transform: rotate(0deg); }
    }
    .container{
    display: flex;
    flex-direction: column;
    align-items: center;
    }

    form{
        margin-top: 30px;
        text-align: center;
    }

    input[type="text"]{
        padding: 8px;
        font-size: 18px;
    }

    input[type="submit"]{
        margin-top: 10px;
        padding: 8px 20px;
        font-size: 18px;
        cursor: pointer;
    }
    p{
        color: white;
        font-size: 30px;
    }
</style>
</head>

<body>
<div class="container">

    <div class="title-box">
        <div class="bomb">💣</div>

        <h1>BOM GAME</h1>

        <div class="bomb">💣</div>
    </div>

    <form method="get" action="#" th:action="@{/bom}">
        <p>名前：<input type="text" name="name"></p>
        <input type="submit" value="GAMESTART">
    </form>

</div>
</body>
</html>
